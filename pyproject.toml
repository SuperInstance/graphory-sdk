[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graphory"
version = "0.1.0"
description = "Python SDK for the Graphory Knowledge Graph API"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "Graphory", email = "hello@graphory.io"},
]
keywords = ["knowledge-graph", "graph-api", "data-infrastructure"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "httpx>=0.24",
]

[project.scripts]
graphory = "graphory.cli:main"

[project.urls]
Homepage = "https://graphory.io"
Repository = "https://github.com/groundstone-group/graphory-sdk"
Documentation = "https://docs.graphory.io"

[tool.setuptools.packages.find]
include = ["graphory*"]
